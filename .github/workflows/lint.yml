name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-changes:
    name: Check if lint needed
    runs-on: ubuntu-latest
    outputs:
      should_lint: ${{ steps.filter.outputs.should_lint }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check changed files
      id: filter
      run: |
        if [ "${{ github.event_name }}" == "push" ]; then
          # Per push su main, lint sempre
          echo "should_lint=true" >> $GITHUB_OUTPUT
        else
          # Per PR, controlla i file modificati
          git fetch origin ${{ github.base_ref }}

          # Verifica se esiste merge base
          if ! git merge-base origin/${{ github.base_ref }} HEAD > /dev/null 2>&1; then
            # Nessuna merge base = nuova branch, esegui lint per sicurezza
            echo "should_lint=true" >> $GITHUB_OUTPUT
            echo "⚠️ Nuova branch senza merge base, lint per sicurezza"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Lint se ci sono modifiche al codice Go o alla configurazione del lint
          if echo "$CHANGED_FILES" | grep -qE '\.go$|^go\.(mod|sum)$|\.golangci\.yml|\.github/workflows/lint\.yml'; then
            echo "should_lint=true" >> $GITHUB_OUTPUT
            echo "✅ Rilevate modifiche che richiedono lint"
          else
            echo "should_lint=false" >> $GITHUB_OUTPUT
            echo "⏭️ Nessuna modifica rilevante, skip lint"
          fi
        fi

  lint:
    name: Lint (gofmt, go vet, golangci-lint)
    needs: check-changes
    if: needs.check-changes.outputs.should_lint == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: gofmt (check only)
      run: |
        UNFORMATTED=$(gofmt -l cmd internal webapp)
        if [ -n "$UNFORMATTED" ]; then
          echo "❌ File non formattati:"
          echo "$UNFORMATTED"
          gofmt -d cmd internal webapp
          exit 1
        fi
        echo "✅ gofmt ok"

    - name: go vet
      run: go vet ./...

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
