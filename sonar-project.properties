# SonarCloud Configuration for OctoTracker
sonar.projectKey=dstmrk_octotracker
sonar.organization=dstmrk

# Project metadata
sonar.projectName=OctoTracker
sonar.projectVersion=5.0.0

# Source code paths (Go: sorgenti e test convivono negli stessi package)
sonar.sources=cmd,internal,webapp
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/testdata/**,**/data/**

# Go coverage report (go test -coverprofile)
sonar.go.coverage.reportPaths=coverage.out

# Encoding
sonar.sourceEncoding=UTF-8

# SCM
sonar.scm.provider=git
